<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>班級百寶箱 · 課堂專用計時系統 v1.2.1</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Chakra Petch & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            digital: ['"Chakra Petch"', 'monospace'],
          },
          colors: {
            theme: {
              dark: '#0f172a',
              card: '#1e293b',
              border: '#334155',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 觸控與排版最佳化 */
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    /* 擬真全螢幕備援樣式（相容受限 iframe 與白板瀏覽器） */
    body.pseudo-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 9999 !important;
      overflow-y: auto !important;
    }

    /* 圓環進度動畫 */
    .progress-ring-circle {
      transition: stroke-dashoffset 0.35s ease-out, stroke 0.3s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* 時間到時的強烈閃爍特效 */
    @keyframes alertPulse {
      0%, 100% {
        background-color: rgba(239, 68, 68, 0.96);
        transform: scale(1);
      }
      50% {
        background-color: rgba(185, 28, 28, 0.99);
        transform: scale(1.02);
      }
    }

    .alert-pulse-animation {
      animation: alertPulse 1.2s infinite ease-in-out;
    }

    /* 倒數最後10秒的呼吸發光 */
    @keyframes urgentGlow {
      0%, 100% { filter: drop-shadow(0 0 18px rgba(244, 63, 94, 0.7)); }
      50% { filter: drop-shadow(0 0 40px rgba(244, 63, 94, 1)); }
    }
    .urgent-glow {
      animation: urgentGlow 1s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden font-sans select-none">

  <!-- 頂部資訊與功能列 -->
  <header class="w-full bg-slate-900/95 border-b border-slate-800 px-4 py-3 sm:px-8 sm:py-4 flex items-center justify-between shadow-lg backdrop-blur z-20">
    <!-- 左側：標題與版本 -->
    <div class="flex items-center gap-3 sm:gap-4">
      <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-sky-500 flex items-center justify-center text-white shadow-lg shadow-sky-500/20 flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-9 sm:h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-black tracking-wider text-white flex items-center gap-3 flex-wrap">
          <span>課堂計時系統</span>
          <span class="text-sm sm:text-base lg:text-lg px-3 py-0.5 rounded-full bg-sky-500/20 text-sky-400 border border-sky-500/40 font-digital font-bold">v1.2.1</span>
        </h1>
      </div>
    </div>

    <!-- 右側：現在時鐘、音效與全螢幕按鈕 -->
    <div class="flex items-center gap-3 sm:gap-4">
      <!-- 現在時間 (字體全面加大) -->
      <div class="hidden md:flex items-center gap-3 bg-slate-800/90 px-5 py-2 rounded-2xl border-2 border-slate-700 shadow-inner">
        <span class="text-slate-300 text-base lg:text-xl font-black">現在時間</span>
        <span id="currentClock" class="font-digital text-emerald-400 font-black text-2xl lg:text-4xl tracking-wider">--:--</span>
      </div>

      <!-- 測試音效按鈕 -->
      <button id="btnTestSound" type="button" onclick="testAlertSound()" title="測試警示音效" aria-label="測試警示音效" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 hover:border-amber-400/60 flex items-center justify-center text-slate-200 hover:text-amber-400 transition shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-9 sm:h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
      </button>

      <!-- 全螢幕切換按鈕 -->
      <button id="btnFullscreen" type="button" onclick="toggleFullScreen()" title="全螢幕切換" aria-label="全螢幕切換" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 hover:border-sky-400/60 flex items-center justify-center text-slate-200 hover:text-sky-400 transition shadow-lg">
        <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 sm:w-9 sm:h-9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 主內容工作區：中央左側超大圓形計時框，中央右側放大控制與選項按鈕 -->
  <main class="flex-1 max-w-[1680px] w-full mx-auto px-4 py-3 sm:px-8 lg:px-12 flex flex-col lg:flex-row items-center justify-center gap-6 lg:gap-12">

    <!-- 中央左側：極大化核心計時看板與進度圓環 -->
    <section class="flex-1 flex items-center justify-center w-full lg:w-[55%] py-1">
      <!-- 超大圓形進度條容器 -->
      <div class="relative w-[330px] h-[330px] sm:w-[460px] sm:h-[460px] md:w-[520px] md:h-[520px] lg:w-[540px] lg:h-[540px] xl:w-[620px] xl:h-[620px] 2xl:w-[660px] 2xl:h-[660px] flex items-center justify-center">
        <svg class="w-full h-full drop-shadow-[0_0_35px_rgba(15,23,42,0.9)]" viewBox="0 0 400 400">
          <!-- 軌道背景圓 -->
          <circle
            cx="200"
            cy="200"
            r="182"
            stroke="currentColor"
            stroke-width="18"
            class="text-slate-800/90"
            fill="rgba(15, 23, 42, 0.55)"
          />
          <!-- 動態彩色進度條 -->
          <circle
            id="progressCircle"
            cx="200"
            cy="200"
            r="182"
            stroke="#38bdf8"
            stroke-width="18"
            stroke-linecap="round"
            class="progress-ring-circle"
            fill="transparent"
            stroke-dasharray="1143.54"
            stroke-dashoffset="0"
          />
        </svg>

        <!-- 圓心超大文字資訊 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6">
          <!-- 狀態標籤 (字體放大) -->
          <div id="statusBadge" class="inline-flex items-center gap-2.5 px-5 py-1.5 sm:px-6 sm:py-2 rounded-full text-base sm:text-xl xl:text-2xl font-black bg-slate-800/95 border-2 border-slate-700 text-slate-200 mb-3 sm:mb-4 shadow-md">
            <span id="statusDot" class="w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-slate-400"></span>
            <span id="statusText">已就緒</span>
          </div>

          <!-- 超大倒數時間 (MM:SS) -->
          <div id="timerDisplay" class="font-digital text-[5.25rem] sm:text-[7.5rem] md:text-[8.5rem] lg:text-[8.8rem] xl:text-[10.2rem] 2xl:text-[11rem] leading-none font-black tracking-tight text-white transition-all select-none">
            03:00
          </div>

          <!-- 剩餘百分比標示 (字體放大) -->
          <div id="percentText" class="text-base sm:text-xl xl:text-2xl font-digital font-black text-slate-300 mt-3 sm:mt-5 tracking-wider">
            剩餘進度：100%
          </div>
        </div>
      </div>
    </section>

    <!-- 中央右側：預設時間快捷鍵、核心控制與微調面板 -->
    <section class="flex-1 flex flex-col justify-center items-center lg:items-stretch w-full lg:w-[45%] max-w-2xl gap-5 sm:gap-6">
      
      <!-- 區塊 1：預設時間快捷選取 (1分、3分、5分、10分) -->
      <div class="w-full bg-slate-900/75 p-5 sm:p-6 rounded-3xl border-2 border-slate-800 shadow-2xl backdrop-blur-sm">
        <div class="flex items-center justify-between mb-4 px-1">
          <span class="text-lg sm:text-xl xl:text-2xl font-black tracking-wider text-slate-200 flex items-center gap-2.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sm:w-7 sm:h-7 text-sky-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            課堂常用預設時間
          </span>
          <span class="text-sm sm:text-base xl:text-lg text-sky-400 font-black">點選即刻就位</span>
        </div>
        <div class="grid grid-cols-2 gap-3.5 sm:gap-4">
          <!-- 1 分鐘 -->
          <button type="button" onclick="setPresetTime(1)" id="preset-1" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/95 border-2 border-slate-700 hover:border-sky-400 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg group">
            <span class="text-4xl sm:text-5xl xl:text-6xl font-black text-sky-400 font-digital group-hover:scale-105 transition-transform">01:00</span>
            <span class="text-base sm:text-xl xl:text-2xl font-black text-slate-200 mt-1.5">1 分鐘 (快問答)</span>
          </button>

          <!-- 3 分鐘 (預設選中) -->
          <button type="button" onclick="setPresetTime(3)" id="preset-3" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/95 border-2 border-sky-500 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg shadow-sky-500/20 group ring-4 ring-sky-500/30">
            <span class="text-4xl sm:text-5xl xl:text-6xl font-black text-sky-400 font-digital group-hover:scale-105 transition-transform">03:00</span>
            <span class="text-base sm:text-xl xl:text-2xl font-black text-slate-200 mt-1.5">3 分鐘 (小組討論)</span>
          </button>

          <!-- 5 分鐘 -->
          <button type="button" onclick="setPresetTime(5)" id="preset-5" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/95 border-2 border-slate-700 hover:border-sky-400 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg group">
            <span class="text-4xl sm:text-5xl xl:text-6xl font-black text-sky-400 font-digital group-hover:scale-105 transition-transform">05:00</span>
            <span class="text-base sm:text-xl xl:text-2xl font-black text-slate-200 mt-1.5">5 分鐘 (課堂練習)</span>
          </button>

          <!-- 10 分鐘 -->
          <button type="button" onclick="setPresetTime(10)" id="preset-10" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/95 border-2 border-slate-700 hover:border-sky-400 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg group">
            <span class="text-4xl sm:text-5xl xl:text-6xl font-black text-sky-400 font-digital group-hover:scale-105 transition-transform">10:00</span>
            <span class="text-base sm:text-xl xl:text-2xl font-black text-slate-200 mt-1.5">10 分鐘 (專題創作)</span>
          </button>
        </div>
      </div>

      <!-- 區塊 2：核心操作按鍵（開始/暫停、重設） -->
      <div class="w-full flex items-center gap-4">
        <!-- 開始 / 暫停按鈕 -->
        <button id="btnToggle" type="button" onclick="toggleTimer()" class="flex-1 min-h-[76px] sm:min-h-[90px] px-6 sm:px-8 rounded-3xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-black text-3xl sm:text-4xl xl:text-5xl flex items-center justify-center gap-3.5 shadow-2xl shadow-emerald-500/25 transition-all">
          <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 sm:w-12 sm:h-12 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
          </svg>
          <span id="btnToggleText">開始計時</span>
        </button>

        <!-- 重設按鈕 -->
        <button id="btnReset" type="button" onclick="resetTimer(true)" title="恢復原設定時間" aria-label="恢復原設定時間" class="w-[76px] h-[76px] sm:w-[90px] sm:h-[90px] flex-shrink-0 rounded-3xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 hover:border-slate-500 text-slate-200 flex items-center justify-center transition-all shadow-xl group">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 sm:w-11 sm:h-11 group-hover:rotate-180 transition-transform duration-500 text-slate-200 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>

      <!-- 區塊 3：時間微調控制項（-1分、-30秒、+30秒、+1分） -->
      <div class="w-full bg-slate-900/60 p-4 sm:p-5 rounded-3xl border-2 border-slate-800/90 flex flex-col gap-3 shadow-xl">
        <div class="flex items-center justify-between px-1">
          <span class="text-base sm:text-xl font-black text-slate-200">彈性微調時長：</span>
          <span class="text-sm sm:text-base font-bold text-slate-400">依課堂即時加減</span>
        </div>
        <div class="grid grid-cols-4 gap-2.5 sm:gap-3 w-full">
          <button type="button" onclick="adjustTime(-60)" class="py-3.5 sm:py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 hover:border-rose-400/50 text-rose-300 text-lg sm:text-2xl xl:text-3xl font-black font-digital transition shadow-md">-1 分</button>
          <button type="button" onclick="adjustTime(-30)" class="py-3.5 sm:py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 hover:border-rose-400/50 text-rose-300 text-lg sm:text-2xl xl:text-3xl font-black font-digital transition shadow-md">-30 秒</button>
          <button type="button" onclick="adjustTime(30)" class="py-3.5 sm:py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 hover:border-emerald-400/50 text-emerald-300 text-lg sm:text-2xl xl:text-3xl font-black font-digital transition shadow-md">+30 秒</button>
          <button type="button" onclick="adjustTime(60)" class="py-3.5 sm:py-4 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 hover:border-emerald-400/50 text-emerald-300 text-lg sm:text-2xl xl:text-3xl font-black font-digital transition shadow-md">+1 分</button>
        </div>
      </div>

    </section>

  </main>

  <!-- 頂部浮動操作回饋通知 (Toast) -->
  <div id="toastBanner" class="fixed top-20 left-1/2 -translate-x-1/2 z-40 pointer-events-none opacity-0 -translate-y-2 transition-all duration-300 bg-slate-800/95 border-2 border-sky-400 text-white px-6 py-3 rounded-2xl shadow-2xl font-black text-lg sm:text-xl flex items-center gap-2.5">
    <span id="toastText">系統就緒</span>
  </div>

  <!-- 頁面底部標註 (字體放大) -->
  <footer class="w-full py-4 text-center border-t border-slate-900 bg-slate-950/90 text-sm sm:text-base lg:text-lg text-slate-300 font-bold tracking-wide">
    班級百寶箱 | Design：S.C. Kuo
  </footer>

  <!-- =============================== -->
  <!-- 時間到！全螢幕強烈視覺警示 Modal -->
  <!-- =============================== -->
  <div id="timeUpModal" class="fixed inset-0 bg-red-950/95 z-50 flex items-center justify-center p-4 sm:p-6 hidden backdrop-blur-md">
    <div class="w-full max-w-4xl bg-red-600 rounded-3xl p-8 sm:p-12 text-center shadow-2xl border-4 border-amber-300 alert-pulse-animation flex flex-col items-center">
      
      <!-- 閃爍時鐘大圖示 -->
      <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-white/20 flex items-center justify-center text-white mb-6 animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 sm:w-24 sm:h-24" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
      </div>

      <!-- 醒目標題 (字體放大) -->
      <h2 class="text-5xl sm:text-7xl lg:text-8xl font-black text-amber-200 tracking-wider mb-4 drop-shadow-md">
        ⏰ 時間到！
      </h2>
      <p class="text-2xl sm:text-4xl font-black text-white mb-8 drop-shadow leading-snug">
        請放下手邊工作，全班眼睛看老師！
      </p>

      <!-- 快捷行動按鍵 (字體與按鈕放大) -->
      <div class="w-full grid grid-cols-1 sm:grid-cols-3 gap-4">
        <button type="button" onclick="dismissAlert()" class="py-5 px-6 rounded-2xl bg-white text-red-700 hover:bg-amber-100 active:scale-95 font-black text-2xl sm:text-3xl shadow-xl transition">
          ✅ 關閉提示
        </button>
        <button type="button" onclick="addTimeAndContinue(60)" class="py-5 px-6 rounded-2xl bg-amber-400 text-slate-950 hover:bg-amber-300 active:scale-95 font-black text-2xl sm:text-3xl shadow-xl transition">
          ⏱️ 加 1 分鐘
        </button>
        <button type="button" onclick="addTimeAndContinue(180)" class="py-5 px-6 rounded-2xl bg-sky-400 text-slate-950 hover:bg-sky-300 active:scale-95 font-black text-2xl sm:text-3xl shadow-xl transition">
          ⏱️ 加 3 分鐘
        </button>
      </div>

    </div>
  </div>

  <!-- JavaScript 計時與音訊核心 -->
  <script>
    // 圓環常數設定 (2 * Math.PI * 182 ≈ 1143.54)
    const CIRCLE_RADIUS = 182;
    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

    // 系統狀態變數
    let targetTotalSeconds = 180; // 預設 3 分鐘 (180 秒)
    let remainingSeconds = 180;
    let timerId = null;
    let isRunning = false;
    let audioCtx = null;
    let alarmIntervalId = null; // 重複響鈴計時器
    let toastTimeoutId = null;  // 浮動提示計時器

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', () => {
      initClock();
      setupProgressCircle();
      updateTimerDisplay();
      updateControlsUI();
      syncPresetButtonsHighlight();
    });

    // 顯示浮動操作提示 (Toast)
    function showToast(message) {
      const banner = document.getElementById('toastBanner');
      const text = document.getElementById('toastText');
      if (!banner || !text) return;

      text.textContent = message;
      banner.classList.remove('opacity-0', '-translate-y-2');
      banner.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeoutId) clearTimeout(toastTimeoutId);
      toastTimeoutId = setTimeout(() => {
        banner.classList.remove('opacity-100', 'translate-y-0');
        banner.classList.add('opacity-0', '-translate-y-2');
      }, 1800);
    }

    // 實時更新頂部時鐘
    function initClock() {
      const clockEl = document.getElementById('currentClock');
      function update() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        if (clockEl) clockEl.textContent = `${hrs}:${mins}`;
      }
      update();
      setInterval(update, 1000);
    }

    // 初始化進度環
    function setupProgressCircle() {
      const circle = document.getElementById('progressCircle');
      if (!circle) return;
      circle.style.strokeDasharray = `${CIRCLE_CIRCUMFERENCE} ${CIRCLE_CIRCUMFERENCE}`;
      updateProgress();
    }

    // 同步預設時間按鈕高亮外框
    function syncPresetButtonsHighlight() {
      const presetMinutes = [1, 3, 5, 10];
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.remove('border-sky-500', 'ring-4', 'ring-sky-500/30', 'shadow-sky-500/20');
        btn.classList.add('border-slate-700');
      });

      if (remainingSeconds === targetTotalSeconds && targetTotalSeconds % 60 === 0) {
        const mins = targetTotalSeconds / 60;
        if (presetMinutes.includes(mins)) {
          const selectedBtn = document.getElementById(`preset-${mins}`);
          if (selectedBtn) {
            selectedBtn.classList.remove('border-slate-700');
            selectedBtn.classList.add('border-sky-500', 'ring-4', 'ring-sky-500/30', 'shadow-sky-500/20');
          }
        }
      }
    }

    // 設定預設時間（1, 3, 5, 10 分鐘）
    function setPresetTime(minutes) {
      initAudio();
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      isRunning = false;
      targetTotalSeconds = minutes * 60;
      remainingSeconds = targetTotalSeconds;

      syncPresetButtonsHighlight();
      updateTimerDisplay();
      updateStatus('ready');
      updateControlsUI();
      showToast(`⏱️ 已設定為 ${minutes} 分鐘`);
    }

    // 切換開始與暫停
    function toggleTimer() {
      initAudio(); // 確保使用者互動觸發 Web Audio 解鎖
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    // 開始計時
    function startTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      if (remainingSeconds <= 0) {
        remainingSeconds = targetTotalSeconds;
      }
      isRunning = true;
      updateStatus('running');
      updateControlsUI();

      // 每秒倒數核心
      timerId = setInterval(() => {
        remainingSeconds--;
        if (remainingSeconds <= 0) {
          remainingSeconds = 0;
          updateTimerDisplay();
          triggerTimeUpAlert();
        } else {
          updateTimerDisplay();
        }
      }, 1000);
    }

    // 暫停計時
    function pauseTimer() {
      isRunning = false;
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      updateStatus('paused');
      updateControlsUI();
    }

    // 重設計時
    function resetTimer(showFeedback = false) {
      initAudio();
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      isRunning = false;
      remainingSeconds = targetTotalSeconds;
      updateTimerDisplay();
      updateStatus('ready');
      updateControlsUI();
      syncPresetButtonsHighlight();
      if (showFeedback) {
        showToast('🔄 計時器已重設');
      }
    }

    // 微調加減時間（秒）
    function adjustTime(deltaSeconds) {
      initAudio();
      const wasAtFullReady = (!isRunning && remainingSeconds === targetTotalSeconds);
      remainingSeconds += deltaSeconds;

      if (remainingSeconds < 10) {
        remainingSeconds = 10; // 至少保留 10 秒
        showToast('⚠️ 最短時間為 10 秒');
      } else {
        const label = deltaSeconds > 0
          ? (deltaSeconds === 60 ? '+1 分鐘' : `+${deltaSeconds} 秒`)
          : (deltaSeconds === -60 ? '-1 分鐘' : `${deltaSeconds} 秒`);
        showToast(`⏱️ 已調整時長 (${label})`);
      }

      if (wasAtFullReady || remainingSeconds > targetTotalSeconds) {
        targetTotalSeconds = remainingSeconds;
      }

      syncPresetButtonsHighlight();
      updateTimerDisplay();
      updateControlsUI();
    }

    // 更新時間與畫面元素
    function updateTimerDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const timerDisplay = document.getElementById('timerDisplay');
      if (!timerDisplay) return;
      timerDisplay.textContent = formatted;

      // 當最後 10 秒時，字體切換為急促呼吸紅光
      if (remainingSeconds <= 10 && remainingSeconds > 0 && isRunning) {
        timerDisplay.classList.add('text-rose-500', 'urgent-glow');
        timerDisplay.classList.remove('text-white', 'text-amber-400');
      } else if (remainingSeconds <= 30 && remainingSeconds > 0 && isRunning) {
        timerDisplay.classList.add('text-amber-400');
        timerDisplay.classList.remove('text-white', 'text-rose-500', 'urgent-glow');
      } else {
        timerDisplay.classList.remove('text-rose-500', 'text-amber-400', 'urgent-glow');
        timerDisplay.classList.add('text-white');
      }

      updateProgress();
    }

    // 更新進度條與百分比
    function updateProgress() {
      const circle = document.getElementById('progressCircle');
      const percentText = document.getElementById('percentText');
      if (!circle || !percentText) return;

      const ratio = targetTotalSeconds > 0 ? Math.min(1, Math.max(0, remainingSeconds / targetTotalSeconds)) : 0;
      const offset = CIRCLE_CIRCUMFERENCE - (ratio * CIRCLE_CIRCUMFERENCE);
      circle.style.strokeDashoffset = offset;

      const percentage = Math.round(ratio * 100);
      percentText.textContent = `剩餘進度：${percentage}%`;

      // 根據剩餘比例改變環狀色彩
      if (percentage <= 15) {
        circle.setAttribute('stroke', '#f43f5e'); // 玫瑰紅
      } else if (percentage <= 35) {
        circle.setAttribute('stroke', '#fbbf24'); // 琥珀金
      } else {
        circle.setAttribute('stroke', '#38bdf8'); // 天空藍
      }
    }

    // 更新狀態徽章
    function updateStatus(state) {
      const badge = document.getElementById('statusBadge');
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (!badge || !dot || !text) return;

      if (state === 'running') {
        badge.className = 'inline-flex items-center gap-2.5 px-5 py-1.5 sm:px-6 sm:py-2 rounded-full text-base sm:text-xl xl:text-2xl font-black bg-emerald-500/20 border-2 border-emerald-500/50 text-emerald-300 mb-3 sm:mb-4 shadow-md';
        dot.className = 'w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-emerald-400 animate-ping';
        text.textContent = '進行中';
      } else if (state === 'paused') {
        badge.className = 'inline-flex items-center gap-2.5 px-5 py-1.5 sm:px-6 sm:py-2 rounded-full text-base sm:text-xl xl:text-2xl font-black bg-amber-500/20 border-2 border-amber-500/50 text-amber-300 mb-3 sm:mb-4 shadow-md';
        dot.className = 'w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-amber-400';
        text.textContent = '已暫停';
      } else if (state === 'ready') {
        badge.className = 'inline-flex items-center gap-2.5 px-5 py-1.5 sm:px-6 sm:py-2 rounded-full text-base sm:text-xl xl:text-2xl font-black bg-slate-800/95 border-2 border-slate-700 text-slate-200 mb-3 sm:mb-4 shadow-md';
        dot.className = 'w-3.5 h-3.5 sm:w-4 sm:h-4 rounded-full bg-slate-400';
        text.textContent = '已就緒';
      }
    }

    // 更新控制器按鈕外觀
    function updateControlsUI() {
      const btn = document.getElementById('btnToggle');
      const btnText = document.getElementById('btnToggleText');
      const playIcon = document.getElementById('playIcon');
      if (!btn || !btnText || !playIcon) return;

      if (isRunning) {
        btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-400', 'shadow-emerald-500/25');
        btn.classList.add('bg-amber-500', 'hover:bg-amber-400', 'shadow-amber-500/25');
        btnText.textContent = '暫停計時';
        playIcon.innerHTML = `
          <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75.75v12a.75.75 0 01-1.5 0v-12a.75.75 0 01.75-.75zm10.5 0a.75.75 0 01.75.75v12a.75.75 0 01-1.5 0v-12a.75.75 0 01.75-.75z" clip-rule="evenodd" />
        `;
      } else {
        btn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'shadow-amber-500/25');
        btn.classList.add('bg-emerald-500', 'hover:bg-emerald-400', 'shadow-emerald-500/25');
        btnText.textContent = (remainingSeconds < targetTotalSeconds && remainingSeconds > 0) ? '繼續計時' : '開始計時';
        playIcon.innerHTML = `
          <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
        `;
      }
    }

    // ==========================================
    // 警示音效合成 (Web Audio API - 免載入外部音檔)
    // ==========================================
    function initAudio() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('Web Audio API 初始化受限:', e);
      }
    }

    // 播放純代碼合成學校鐘聲 (Westminster Chime 音調風格)
    function playSchoolBell() {
      initAudio();
      if (!audioCtx) return;

      const notes = [
        { freq: 659.25, time: 0.0, duration: 0.55 },
        { freq: 523.25, time: 0.45, duration: 0.55 },
        { freq: 587.33, time: 0.90, duration: 0.55 },
        { freq: 392.00, time: 1.35, duration: 1.15 }
      ];

      const now = audioCtx.currentTime;

      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.freq, now + n.time);

        gain.gain.setValueAtTime(0.001, now + n.time);
        gain.gain.exponentialRampToValueAtTime(0.55, now + n.time + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + n.time);
        osc.stop(now + n.time + n.duration);
      });
    }

    // 測試鐘聲音效
    function testAlertSound() {
      playSchoolBell();
      showToast('🔔 正在播放測試鐘聲');
    }

    // ==========================================
    // 時間到！觸發視覺警示與重複警示音
    // ==========================================
    function triggerTimeUpAlert() {
      pauseTimer();
      const modal = document.getElementById('timeUpModal');
      if (modal) modal.classList.remove('hidden');

      playSchoolBell();
      if (alarmIntervalId) clearInterval(alarmIntervalId);
      alarmIntervalId = setInterval(() => {
        playSchoolBell();
      }, 3500);
    }

    // 關閉時間到警示
    function dismissAlert() {
      const modal = document.getElementById('timeUpModal');
      if (modal) modal.classList.add('hidden');
      if (alarmIntervalId) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
      resetTimer(false);
    }

    // 增加時間並立即繼續計時
    function addTimeAndContinue(seconds) {
      const modal = document.getElementById('timeUpModal');
      if (modal) modal.classList.add('hidden');
      if (alarmIntervalId) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
      targetTotalSeconds = seconds;
      remainingSeconds = seconds;
      syncPresetButtonsHighlight();
      updateTimerDisplay();
      startTimer();
      showToast(`⏱️ 已延長 ${Math.round(seconds / 60)} 分鐘並繼續計時`);
    }

    // ==========================================
    // 全螢幕切換支援 (含原生 API 與擬真全螢幕備援)
    // ==========================================
    function toggleFullScreen() {
      const isNativeFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const isPseudoFull = document.body.classList.contains('pseudo-fullscreen');

      if (!isNativeFull && !isPseudoFull) {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().then(() => {
            showToast('⛶ 已進入全螢幕模式');
          }).catch(() => {
            document.body.classList.add('pseudo-fullscreen');
            updateFullscreenIcon();
            showToast('⛶ 已展開滿版檢視模式');
          });
        } else if (el.webkitRequestFullscreen) {
          try {
            el.webkitRequestFullscreen();
            showToast('⛶ 已進入全螢幕模式');
          } catch (e) {
            document.body.classList.add('pseudo-fullscreen');
            updateFullscreenIcon();
            showToast('⛶ 已展開滿版檢視模式');
          }
        } else {
          document.body.classList.add('pseudo-fullscreen');
          updateFullscreenIcon();
          showToast('⛶ 已展開滿版檢視模式');
        }
      } else {
        if (isNativeFull) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
        if (isPseudoFull) {
          document.body.classList.remove('pseudo-fullscreen');
          updateFullscreenIcon();
        }
        showToast('⛶ 已退出全螢幕模式');
      }
    }

    // 監聽全螢幕變化切換圖示
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

    function updateFullscreenIcon() {
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains('pseudo-fullscreen'));
      const icon = document.getElementById('fullscreenIcon');
      if (!icon) return;
      if (isFull) {
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 9L4 4m0 0l5 0m-5 0l0 5m11-5l5 0m0 0l0 5m0-5l-5 5M9 15l-5 5m0 0l5 0m-5 0l0-5m16 5l-5-5m5 5l-5 0m5 0l0-5" />
        `;
      } else {
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        `;
      }
    }

    // 鍵盤快捷鍵支援 (空白鍵開始/暫停、ESC 關閉警示或退出滿版)
    window.addEventListener('keydown', (e) => {
      const modal = document.getElementById('timeUpModal');
      const isModalOpen = modal && !modal.classList.contains('hidden');

      if (e.key === 'Escape') {
        if (isModalOpen) {
          dismissAlert();
        } else if (document.body.classList.contains('pseudo-fullscreen')) {
          document.body.classList.remove('pseudo-fullscreen');
          updateFullscreenIcon();
          showToast('⛶ 已退出全螢幕模式');
        }
      } else if (e.code === 'Space' && !isModalOpen && document.activeElement.tagName !== 'BUTTON') {
        e.preventDefault();
        toggleTimer();
      }
    });
  </script>
