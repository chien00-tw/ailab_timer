<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>班級百寶箱 · 課堂專用計時系統 v1.0.0</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Chakra Petch (高辨識度數位字體) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'sans-serif'],
            digital: ['"Chakra Petch"', 'monospace'],
          },
          colors: {
            theme: {
              dark: '#0f172a',
              card: '#1e293b',
              border: '#334155',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 觸控與排版優化 */
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    /* 圓環進度動畫 */
    .progress-ring-circle {
      transition: stroke-dashoffset 0.35s ease-out, stroke 0.3s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    /* 時間到時的強烈閃爍特效 */
    @keyframes alertPulse {
      0%, 100% {
        background-color: rgba(239, 68, 68, 0.95);
        transform: scale(1);
      }
      50% {
        background-color: rgba(185, 28, 28, 0.98);
        transform: scale(1.02);
      }
    }

    .alert-pulse-animation {
      animation: alertPulse 1.2s infinite ease-in-out;
    }

    /* 倒數最後10秒的呼吸發光 */
    @keyframes urgentGlow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(244, 63, 94, 0.6)); }
      50% { filter: drop-shadow(0 0 35px rgba(244, 63, 94, 0.95)); }
    }
    .urgent-glow {
      animation: urgentGlow 1s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden font-sans select-none">

  <!-- 頂部資訊與功能列 -->
  <header class="w-full bg-slate-900/90 border-b border-slate-800 px-4 py-3 sm:px-6 flex items-center justify-between shadow-md backdrop-blur z-20">
    <!-- 左側：標題與版本 -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-sky-500 flex items-center justify-center text-white shadow-lg shadow-sky-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black tracking-wider text-white flex items-center gap-2">
          課堂計時系統
          <span class="text-xs px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-400 border border-sky-500/30 font-digital font-bold">v1.0.0</span>
        </h1>
      </div>
    </div>

    <!-- 右側：現在時鐘、音效與全螢幕按鈕 -->
    <div class="flex items-center gap-2 sm:gap-4">
      <!-- 現在時間 -->
      <div class="hidden md:flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
        <span class="text-slate-400 text-xs font-bold">現在時間</span>
        <span id="currentClock" class="font-digital text-emerald-400 font-bold text-lg tracking-wider">--:--</span>
      </div>

      <!-- 測試音效按鈕 -->
      <button onclick="testAlertSound()" title="測試警示音效" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-amber-400 transition shadow">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        </svg>
      </button>

      <!-- 全螢幕切換按鈕 -->
      <button onclick="toggleFullScreen()" title="全螢幕切換" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 flex items-center justify-center text-slate-300 hover:text-sky-400 transition shadow">
        <svg id="fullscreenIcon" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
      </button>
    </div>
  </header>

  <!-- 主內容工作區 -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center items-center gap-6">

    <!-- 預設時間快捷鍵區（1分、3分、5分、10分） -->
    <section class="w-full max-w-3xl">
      <div class="text-center mb-3">
        <span class="text-xs sm:text-sm font-bold tracking-widest text-slate-400 uppercase">預設課堂時間快速選取</span>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
        <!-- 1 分鐘 -->
        <button onclick="setPresetTime(1)" id="preset-1" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/90 border-2 border-slate-700 hover:border-sky-500 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg group">
          <span class="text-2xl sm:text-3xl font-black text-sky-400 font-digital group-hover:scale-110 transition-transform">01:00</span>
          <span class="text-sm font-bold text-slate-300 mt-1">1 分鐘 (快問答)</span>
        </button>

        <!-- 3 分鐘 (預設高亮) -->
        <button onclick="setPresetTime(3)" id="preset-3" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/90 border-2 border-sky-500 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg shadow-sky-500/10 group ring-2 ring-sky-500/40">
          <span class="text-2xl sm:text-3xl font-black text-sky-400 font-digital group-hover:scale-110 transition-transform">03:00</span>
          <span class="text-sm font-bold text-slate-300 mt-1">3 分鐘 (小組討論)</span>
        </button>

        <!-- 5 分鐘 -->
        <button onclick="setPresetTime(5)" id="preset-5" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/90 border-2 border-slate-700 hover:border-sky-500 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg group">
          <span class="text-2xl sm:text-3xl font-black text-sky-400 font-digital group-hover:scale-110 transition-transform">05:00</span>
          <span class="text-sm font-bold text-slate-300 mt-1">5 分鐘 (課堂練習)</span>
        </button>

        <!-- 10 分鐘 -->
        <button onclick="setPresetTime(10)" id="preset-10" class="preset-btn py-4 sm:py-5 px-3 rounded-2xl bg-slate-800/90 border-2 border-slate-700 hover:border-sky-500 active:scale-95 transition-all flex flex-col items-center justify-center shadow-lg group">
          <span class="text-2xl sm:text-3xl font-black text-sky-400 font-digital group-hover:scale-110 transition-transform">10:00</span>
          <span class="text-sm font-bold text-slate-300 mt-1">10 分鐘 (專題創作)</span>
        </button>
      </div>
    </section>

    <!-- 核心超大計時看板與進度圓環 -->
    <section class="relative flex items-center justify-center w-full max-w-xl py-2">
      <!-- 圓形進度條容器 -->
      <div class="relative w-[320px] h-[320px] sm:w-[420px] sm:h-[420px] flex items-center justify-center">
        <svg class="w-full h-full drop-shadow-2xl" viewBox="0 0 400 400">
          <!-- 軌道背景圓 -->
          <circle
            cx="200"
            cy="200"
            r="175"
            stroke="currentColor"
            stroke-width="16"
            class="text-slate-800"
            fill="transparent"
          />
          <!-- 動態彩色進度條 -->
          <circle
            id="progressCircle"
            cx="200"
            cy="200"
            r="175"
            stroke="#38bdf8"
            stroke-width="16"
            stroke-linecap="round"
            class="progress-ring-circle"
            fill="transparent"
            stroke-dasharray="1099.56"
            stroke-dashoffset="0"
          />
        </svg>

        <!-- 圓心文字資訊 -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4">
          <!-- 狀態標籤 -->
          <div id="statusBadge" class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-slate-800/90 border border-slate-700 text-slate-300 mb-2 shadow">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <span id="statusText">已就緒</span>
          </div>

          <!-- 超大倒數時間 (MM:SS) -->
          <div id="timerDisplay" class="font-digital text-7xl sm:text-8xl md:text-9xl font-black tracking-tight text-white transition-all select-none">
            03:00
          </div>

          <!-- 剩餘百分比標示 -->
          <div id="percentText" class="text-xs sm:text-sm font-digital font-bold text-slate-400 mt-2 tracking-wider">
            剩餘進度：100%
          </div>
        </div>
      </div>
    </section>

    <!-- 主操作控制器（開始/暫停、重設、微調加減時間） -->
    <section class="w-full max-w-2xl flex flex-col items-center gap-4">
      <!-- 核心控制按鍵（超大觸控，適配大螢幕與iPad） -->
      <div class="flex items-center justify-center gap-4 sm:gap-6 w-full">
        <!-- 開始 / 暫停按鈕 -->
        <button id="btnToggle" onclick="toggleTimer()" class="flex-1 max-w-xs min-h-[64px] sm:min-h-[72px] px-8 rounded-2xl bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-black text-2xl sm:text-3xl flex items-center justify-center gap-3 shadow-xl shadow-emerald-500/20 transition-all">
          <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor">
            <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
          </svg>
          <span id="btnToggleText">開始計時</span>
        </button>

        <!-- 重設按鈕 -->
        <button onclick="resetTimer()" title="恢復原設定時間" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border-2 border-slate-700 text-slate-200 flex items-center justify-center transition-all shadow-lg group">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 group-hover:rotate-180 transition-transform duration-500 text-slate-300 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
      </div>

      <!-- 時間微調控制項（+30秒、+1分、-30秒、-1分） -->
      <div class="flex items-center justify-center flex-wrap gap-2 sm:gap-3 w-full pt-1">
        <span class="text-xs font-bold text-slate-400 mr-1 hidden sm:inline">時間微調：</span>
        <button onclick="adjustTime(-60)" class="px-3.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-300 text-sm font-bold font-digital">-1 分鐘</button>
        <button onclick="adjustTime(-30)" class="px-3.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-300 text-sm font-bold font-digital">-30 秒</button>
        <button onclick="adjustTime(30)" class="px-3.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-300 text-sm font-bold font-digital">+30 秒</button>
        <button onclick="adjustTime(60)" class="px-3.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-300 text-sm font-bold font-digital">+1 分鐘</button>
      </div>
    </section>

  </main>

  <!-- 頁面底部標註 -->
  <footer class="w-full py-4 text-center border-t border-slate-900 bg-slate-950/80 text-xs sm:text-sm text-slate-400 font-medium">
    班級百寶箱 | 互動教學系統 | 教材設計：S.C. Kuo
  </footer>

  <!-- =============================== -->
  <!-- 時間到！全螢幕強烈視覺警示 Modal -->
  <!-- =============================== -->
  <div id="timeUpModal" class="fixed inset-0 bg-red-950/95 z-50 flex items-center justify-center p-4 hidden backdrop-blur-md">
    <div class="w-full max-w-2xl bg-red-600 rounded-3xl p-6 sm:p-10 text-center shadow-2xl border-4 border-amber-300 alert-pulse-animation flex flex-col items-center">
      
      <!-- 閃爍時鐘大圖示 -->
      <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-white/20 flex items-center justify-center text-white mb-4 animate-bounce">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 sm:w-20 sm:h-20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
      </div>

      <!-- 醒目標題 -->
      <h2 class="text-4xl sm:text-6xl font-black text-amber-200 tracking-wider mb-2 drop-shadow-md">
        ⏰ 時間到！
      </h2>
      <p class="text-xl sm:text-2xl font-bold text-white mb-6 drop-shadow">
        請放下手邊工作，全班眼睛看老師！
      </p>

      <!-- 快捷行動按鍵 -->
      <div class="w-full grid grid-cols-1 sm:grid-cols-3 gap-3">
        <button onclick="dismissAlert()" class="py-4 px-6 rounded-2xl bg-white text-red-700 hover:bg-amber-100 active:scale-95 font-black text-xl shadow-lg transition">
          ✅ 關閉提示
        </button>
        <button onclick="addTimeAndContinue(60)" class="py-4 px-6 rounded-2xl bg-amber-400 text-slate-950 hover:bg-amber-300 active:scale-95 font-black text-xl shadow-lg transition">
          ⏱️ 加 1 分鐘
        </button>
        <button onclick="addTimeAndContinue(180)" class="py-4 px-6 rounded-2xl bg-sky-400 text-slate-950 hover:bg-sky-300 active:scale-95 font-black text-xl shadow-lg transition">
          ⏱️ 加 3 分鐘
        </button>
      </div>

    </div>
  </div>

  <!-- JavaScript 計時與音訊核心 -->
  <script>
    // 圓環常數設定 (2 * Math.PI * 175 ≈ 1099.56)
    const CIRCLE_RADIUS = 175;
    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

    // 系統狀態變數
    let targetTotalSeconds = 180; // 預設 3 分鐘 (180 秒)
    let remainingSeconds = 180;
    let timerId = null;
    let isRunning = false;
    let audioCtx = null;
    let alarmIntervalId = null; // 重複響鈴句柄

    // 初始化頁面
    window.addEventListener('DOMContentLoaded', () => {
      initClock();
      updateTimerDisplay();
      setupProgressCircle();
    });

    // 實時更新頂部時鐘
    function initClock() {
      const clockEl = document.getElementById('currentClock');
      function update() {
        const now = new Date();
        const hrs = String(now.getHours()).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        clockEl.textContent = `${hrs}:${mins}`;
      }
      update();
      setInterval(update, 1000);
    }

    // 初始化進度環
    function setupProgressCircle() {
      const circle = document.getElementById('progressCircle');
      circle.style.strokeDasharray = `${CIRCLE_CIRCUMFERENCE} ${CIRCLE_CIRCUMFERENCE}`;
      updateProgress();
    }

    // 設定預設時間（1, 3, 5, 10 分鐘）
    function setPresetTime(minutes) {
      if (isRunning) {
        pauseTimer();
      }
      targetTotalSeconds = minutes * 60;
      remainingSeconds = targetTotalSeconds;

      // 更新預設按鈕的外觀反饋
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.classList.remove('border-sky-500', 'ring-2', 'ring-sky-500/40');
        btn.classList.add('border-slate-700');
      });
      const selectedBtn = document.getElementById(`preset-${minutes}`);
      if (selectedBtn) {
        selectedBtn.classList.remove('border-slate-700');
        selectedBtn.classList.add('border-sky-500', 'ring-2', 'ring-sky-500/40');
      }

      updateTimerDisplay();
      updateStatus('ready');
    }

    // 切換開始與暫停
    function toggleTimer() {
      initAudio(); // 確保使用者互動觸發 Web Audio 解鎖
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    // 開始計時
    function startTimer() {
      if (remainingSeconds <= 0) {
        remainingSeconds = targetTotalSeconds;
      }
      isRunning = true;
      updateStatus('running');
      updateControlsUI();

      // 每秒倒數核心
      timerId = setInterval(() => {
        remainingSeconds--;
        if (remainingSeconds <= 0) {
          remainingSeconds = 0;
          updateTimerDisplay();
          triggerTimeUpAlert();
        } else {
          updateTimerDisplay();
        }
      }, 1000);
    }

    // 暫停計時
    function pauseTimer() {
      isRunning = false;
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      updateStatus('paused');
      updateControlsUI();
    }

    // 重設計時
    function resetTimer() {
      pauseTimer();
      remainingSeconds = targetTotalSeconds;
      updateTimerDisplay();
      updateStatus('ready');
    }

    // 微調加減時間（秒）
    function adjustTime(deltaSeconds) {
      initAudio();
      remainingSeconds += deltaSeconds;
      if (remainingSeconds < 10) remainingSeconds = 10; // 至少保留 10 秒
      if (remainingSeconds > targetTotalSeconds) {
        targetTotalSeconds = remainingSeconds;
      }
      updateTimerDisplay();
    }

    // 更新時間與畫面元素
    function updateTimerDisplay() {
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const timerDisplay = document.getElementById('timerDisplay');
      timerDisplay.textContent = formatted;

      // 當最後 10 秒時，字體切換為急促呼吸紅光
      if (remainingSeconds <= 10 && remainingSeconds > 0 && isRunning) {
        timerDisplay.classList.add('text-rose-500', 'urgent-glow');
        timerDisplay.classList.remove('text-white', 'text-amber-400');
      } else if (remainingSeconds <= 30 && remainingSeconds > 0 && isRunning) {
        timerDisplay.classList.add('text-amber-400');
        timerDisplay.classList.remove('text-white', 'text-rose-500', 'urgent-glow');
      } else {
        timerDisplay.classList.remove('text-rose-500', 'text-amber-400', 'urgent-glow');
        timerDisplay.classList.add('text-white');
      }

      updateProgress();
    }

    // 更新進度條與百分比
    function updateProgress() {
      const circle = document.getElementById('progressCircle');
      const percentText = document.getElementById('percentText');
      const ratio = targetTotalSeconds > 0 ? remainingSeconds / targetTotalSeconds : 0;
      const offset = CIRCLE_CIRCUMFERENCE - (ratio * CIRCLE_CIRCUMFERENCE);
      circle.style.strokeDashoffset = offset;

      const percentage = Math.round(ratio * 100);
      percentText.textContent = `剩餘進度：${percentage}%`;

      // 根據剩餘比例改變環狀色彩
      if (percentage <= 15) {
        circle.setAttribute('stroke', '#f43f5e'); // 玫瑰紅
      } else if (percentage <= 35) {
        circle.setAttribute('stroke', '#fbbf24'); // 琥珀金
      } else {
        circle.setAttribute('stroke', '#38bdf8'); // 天空藍
      }
    }

    // 更新狀態徽章
    function updateStatus(state) {
      const badge = document.getElementById('statusBadge');
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');

      if (state === 'running') {
        badge.className = 'inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 mb-2 shadow';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping';
        text.textContent = '進行中';
      } else if (state === 'paused') {
        badge.className = 'inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-amber-500/20 border border-amber-500/40 text-amber-300 mb-2 shadow';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400';
        text.textContent = '已暫停';
      } else if (state === 'ready') {
        badge.className = 'inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs sm:text-sm font-bold bg-slate-800/90 border border-slate-700 text-slate-300 mb-2 shadow';
        dot.className = 'w-2.5 h-2.5 rounded-full bg-slate-400';
        text.textContent = '已就緒';
      }
    }

    // 更新控制器按鈕外觀
    function updateControlsUI() {
      const btn = document.getElementById('btnToggle');
      const btnText = document.getElementById('btnToggleText');
      const playIcon = document.getElementById('playIcon');

      if (isRunning) {
        btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-400', 'text-slate-950');
        btn.classList.add('bg-amber-500', 'hover:bg-amber-400', 'text-slate-950');
        btnText.textContent = '暫停計時';
        playIcon.innerHTML = `
          <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 01.75.75v12a.75.75 0 01-1.5 0v-12a.75.75 0 01.75-.75zm10.5 0a.75.75 0 01.75.75v12a.75.75 0 01-1.5 0v-12a.75.75 0 01.75-.75z" clip-rule="evenodd" />
        `;
      } else {
        btn.classList.remove('bg-amber-500', 'hover:bg-amber-400', 'text-slate-950');
        btn.classList.add('bg-emerald-500', 'hover:bg-emerald-400', 'text-slate-950');
        btnText.textContent = remainingSeconds < targetTotalSeconds ? '繼續計時' : '開始計時';
        playIcon.innerHTML = `
          <path fill-rule="evenodd" d="M4.5 5.653c0-1.426 1.529-2.33 2.779-1.643l11.54 6.348c1.295.712 1.295 2.573 0 3.285L7.28 19.991c-1.25.687-2.779-.217-2.779-1.643V5.653z" clip-rule="evenodd" />
        `;
      }
    }

    // ==========================================
    // 警示音效合成 (Web Audio API - 免載入外部音檔)
    // ==========================================
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 播放純代碼合成學校鐘聲 (Westminster Chime 音調風格)
    function playSchoolBell() {
      initAudio();
      if (!audioCtx) return;

      // 旋律音符頻率：E5 (659.25), C5 (523.25), D5 (587.33), G4 (392.00)
      const notes = [
        { freq: 659.25, time: 0.0, duration: 0.55 },
        { freq: 523.25, time: 0.45, duration: 0.55 },
        { freq: 587.33, time: 0.90, duration: 0.55 },
        { freq: 392.00, time: 1.35, duration: 1.10 }
      ];

      const now = audioCtx.currentTime;

      notes.forEach(n => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // 正弦波加上自然鐘聲泛音
        osc.type = 'sine';
        osc.frequency.setValueAtTime(n.freq, now + n.time);

        // 溫和且具穿透力的音量包絡 (ADSR: 瞬發衰減)
        gain.gain.setValueAtTime(0.001, now + n.time);
        gain.gain.exponentialRampToValueAtTime(0.5, now + n.time + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.001, now + n.time + n.duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + n.time);
        osc.stop(now + n.time + n.duration);
      });
    }

    // 測試鐘聲音效
    function testAlertSound() {
      playSchoolBell();
    }

    // ==========================================
    // 時間到！觸發視覺警示與重複警示音
    // ==========================================
    function triggerTimeUpAlert() {
      pauseTimer();
      const modal = document.getElementById('timeUpModal');
      modal.classList.remove('hidden');

      // 立即響鈴，並每 3.5 秒重複響鈴一次，共持續直到點擊關閉
      playSchoolBell();
      if (alarmIntervalId) clearInterval(alarmIntervalId);
      alarmIntervalId = setInterval(() => {
        playSchoolBell();
      }, 3500);
    }

    // 關閉時間到警示
    function dismissAlert() {
      const modal = document.getElementById('timeUpModal');
      modal.classList.add('hidden');
      if (alarmIntervalId) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
      resetTimer();
    }

    // 增加時間並立即繼續計時
    function addTimeAndContinue(seconds) {
      const modal = document.getElementById('timeUpModal');
      modal.classList.add('hidden');
      if (alarmIntervalId) {
        clearInterval(alarmIntervalId);
        alarmIntervalId = null;
      }
      targetTotalSeconds = seconds;
      remainingSeconds = seconds;
      updateTimerDisplay();
      startTimer();
    }

    // ==========================================
    // 全螢幕切換支援 (相容多載具與 iPad)
    // ==========================================
    function toggleFullScreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(err => console.log(err));
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // 監聽全螢幕變化切換圖示
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

    function updateFullscreenIcon() {
      const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
      const icon = document.getElementById('fullscreenIcon');
      if (isFull) {
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 9L4 4m0 0l5 0m-5 0l0 5m11-5l5 0m0 0l0 5m0-5l-5 5M9 15l-5 5m0 0l5 0m-5 0l0-5m16 5l-5-5m5 5l-5 0m5 0l0-5" />
        `;
      } else {
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        `;
      }
    }
  </script>
